services:
  fuse:
    build:
      context: .
      target: runtime
    image: m4a-atmos-to-mp4-vid-fuse:runtime
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-1}
      WEBDAV_ADDR: 0.0.0.0:9090
      WEBDAV_DIR_CACHE_TIME: 24h
    entrypoint:
      - /usr/local/bin/m4a-atmos-webdav
    healthcheck:
      test: ["CMD", "mountpoint", "-q", "/mnt/virtual"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 2s
    ports:
      - 0.0.0.0:9090:9090
    volumes:
      - ./sample:/mnt/source:ro
      - ./cache:/var/cache/m4a-atmos-fuse
      - type: bind
        source: ./virtual
        target: /mnt/virtual
    restart: unless-stopped

  dev:
    build:
      context: .
      target: dev
    image: m4a-atmos-to-mp4-vid-fuse:dev
    working_dir: /workspace
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/workspace/target
    profiles:
      - dev

volumes:
  cargo-registry:
  cargo-git:
  target:
